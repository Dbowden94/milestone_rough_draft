<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Join Diamond's crochet community and ask a question.">
  <title>Get Connected | Crochet Guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><script src="script.js" defer></script>
</head>
<body>
  <nav class="page-nav" aria-label="Main navigation"><a href="index.html">Home</a><a href="start.html">Where Should I Start?</a><a href="must-knows.html">Must Knows</a><a href="must-haves.html">Must Haves</a><a href="about.html">About Me</a></nav>
  <header class="page-header"><h1 class="page-title">Get Connected</h1></header>
  <main class="page-content"><section class="content-card form-card">
    <h2>Join the Crochet Community</h2><p>Sign up for crochet news and community updates, or send a question for the forum.</p>
    <form id="community-form" novalidate>
      <div class="form-grid">
        <label>First Name<input type="text" id="first-name" name="firstName" minlength="3" required aria-describedby="name-error"><span class="error" id="name-error" aria-live="polite"></span></label>
        <label>Email Address<input type="email" id="email" name="email" required aria-describedby="email-error"><span class="error" id="email-error" aria-live="polite"></span></label>
      </div>
      <fieldset><legend>What would you like to join?</legend>
        <label class="check-label"><input type="checkbox" name="interests" value="newsletter"> Crochet newsletters</label>
        <label class="check-label"><input type="checkbox" name="interests" value="community"> Online communities and platforms</label>
      </fieldset>
      <label>Your Forum Question<textarea id="question" name="question" rows="5" minlength="3" placeholder="What would you like to ask?" aria-describedby="question-error"></textarea><span class="error" id="question-error" aria-live="polite"></span></label>
      <button class="submit-button" type="submit">Join &amp; Submit</button><p class="success-message" id="form-message" aria-live="polite"></p>
    </form>
  </section></main>
  <footer class="site-footer">&copy; 2026 Diamond Bowden</footer>
</body>
</html>
